<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'"><title>Master Chief Hologram</title><link rel="stylesheet" href="styles.css"></head><body><main id="app" data-theme="night">
<header class="titlebar"><div class="window-controls"><button id="closeBtn" aria-label="Hide Master Chief"><span class="red"></span></button><button id="minBtn" aria-label="Minimize"><span class="yellow"></span></button><button id="pinBtn" aria-label="Toggle always on top" aria-pressed="true"><span class="green"></span></button></div><div class="title">MASTER CHIEF <span id="versionTitle"></span></div><div class="theme-switch" role="group" aria-label="Appearance"><button data-mode="auto" aria-pressed="true">Auto</button><button data-mode="day">Light</button><button data-mode="night">Dark</button><button id="visualModeBtn" aria-pressed="true" aria-label="Toggle interactive 3D companion">3D</button></div></header>
<button id="holoStage" class="holo-stage" aria-label="Master Chief is ready. Focus command input."><span class="glow-ring"></span><img id="holoImg" src="assets/states/night/night_idle.jpg" alt="Master Chief hologram ready for orders"><canvas id="threeScene" aria-hidden="true"></canvas><span class="scanlines"></span><span id="holoStatus" class="holo-status" role="status" aria-live="polite">Ready for orders</span></button>
<section class="routebar"><span id="statusDot" class="status-dot"></span><label for="modelSelect" class="sr-only">AI model</label><select id="modelSelect"><option value="ollama">Ollama · Local first</option><option value="codex">Codex Desktop</option><option value="openai">OpenAI API</option><option value="grok">Grok · xAI</option><option value="huggingface">Hugging Face · Endpoint</option></select><label class="mc-toggle"><input type="checkbox" id="masterMode" checked> MC Mode</label></section>
<details><summary id="healthSummary">Checking systems…</summary><div id="providerHealth" class="provider-health"></div></details><details class="tool-access"><summary>Tool access</summary><div id="toolApprovals" class="provider-health" aria-live="polite">Loading permissions…</div><p class="hint">Capabilities are bounded and disabled until approved.</p></details><section id="chat" aria-label="Conversation" aria-live="polite"></section>
<section class="composer"><label for="prompt" class="sr-only">Command</label><textarea id="prompt" aria-describedby="versionHint autocompleteHint" aria-autocomplete="list" aria-controls="autocompleteList" placeholder="Give Master Chief an order…"></textarea><div id="autocompleteList" class="autocomplete-list" role="listbox" aria-label="Local command suggestions"></div><div id="autocompleteHint" class="sr-only">Use up and down arrows to choose a local command suggestion, then Tab to insert it.</div><input id="fileInput" class="sr-only" type="file" accept=".txt,.md,.json,.csv,text/plain,text/markdown,application/json,text/csv"><div id="attachments" class="attachments" aria-live="polite"></div><div class="actions"><button id="attachBtn" type="button" aria-label="Attach a local text file">ATTACH</button><button id="micBtn" type="button" aria-pressed="false" aria-label="Start microphone recording">MIC</button><button id="micSettingsBtn" type="button" hidden aria-label="Open macOS Microphone settings">MIC SETTINGS</button><button id="sendBtn" class="primary" aria-label="Transmit command">TRANSMIT</button><button id="paletteBtn" type="button" aria-label="Open command palette">⌘K</button><button id="clearBtn" type="button">Clear chat</button></div><div id="versionHint" class="hint" role="status" aria-live="polite">Local history · ⌘Enter to send</div></section>
<dialog id="commandPalette" aria-labelledby="paletteTitle"><h2 id="paletteTitle">Command palette</h2><input id="paletteSearch" placeholder="Search commands…" aria-label="Search commands"><div id="paletteItems"></div></dialog></main><script src="autocomplete.js"></script><script src="local-routing.js"></script><script src="renderer.js"></script><script type="module" src="three-scene.js"></script><script src="voice-setup-ui.js"></script></body></html>
