name: Bug report
description: Report a reproducible Master Chief defect without private data
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Do not include credentials, private prompts, documents, media, or LAN addresses.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: App version and revision }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes: { label: Redacted diagnostics or test evidence }
